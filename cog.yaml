build:
  gpu: true
  # `cuda:` names the base image only; torch's pip wheels bring their own
  # CUDA 13 runtime. It must be set (Cog cannot infer a CUDA version for this
  # torch pin), must have a published r8.im/cog-base image (13.0 does not;
  # Cog's fallback base fails to build, and a non-Replicate base built with
  # --use-cuda-base-image false never starts on Replicate), and must be no
  # newer than the wheels expect, which tests/test_packaging.py enforces.
  # 12.8 is the newest that qualifies. The real driver floor comes from the
  # cu130 wheels, and predictor.setup() fails loudly if it is unmet.
  # The predictor builds Separator(compile=True), whose compiled graph uses
  # stock PyTorch ops rather than the fused CUDA kernels, so the image needs no
  # nvcc; setup() logs custom_kernels_loaded (False here).
  cuda: "12.8"
  python_version: "3.12"
  # Not pinned to a Cog CLI version: predictor.py's TypedDict ``Output`` and
  # single-choice ``model`` input build with the pydantic SDK (0.16 and
  # earlier) and with Cog 0.20+, which generates the schema statically. The
  # 0.17-0.19 Python schema inspector rejects both.
  # Generated from uv.lock; CI fails if this export drifts.
  python_requirements: "requirements-cog.txt"
  system_packages:
    - "ffmpeg"
  run:
    - mkdir -p /root/.unblend/models
    # Bake the only served model (htdemucs) into the image so cold starts
    # skip the download. URL and checksum come from unblend/metadata.yaml; the
    # filename is the short checksum, matching unblend.repo's cache naming.
    - curl --fail --location --max-time 7200 --max-filesize 84023856 --output /root/.unblend/models/d3cb2f212d065294.safetensors https://huggingface.co/Ryan5453/unblend/resolve/9ba75778acf1b64fc40a9ea05137a2c6af9cd1d5/htdemucs.safetensors
    - echo 'd3cb2f212d0652945fd033c26e1fbfdf9b6fbb9087aa6104def87f08b1016a81  /root/.unblend/models/d3cb2f212d065294.safetensors' | sha256sum --check --strict
    # Drop the base image's LD_LIBRARY_PATH (its CUDA 12.8 libraries) for
    # processes Python spawns. It can't change the running interpreter: the
    # loader reads the variable at process start. The main process is safe
    # anyway, because the CUDA 12 and 13 libraries have different sonames.
    - python -c "import site; open(site.getsitepackages()[0] + '/sitecustomize.py', 'w').write('import os\nos.environ.pop(\"LD_LIBRARY_PATH\", None)\n')"

# Environment variables predictor.py reads:
#   UNBLEND_MAX_AUDIO_SECONDS  longest accepted input (default 1800)
#   UNBLEND_BATCH_WINDOW_MS    how long to wait for requests to batch (default 50)
#   UNBLEND_ALLOW_CPU=1        start even when CUDA is unavailable
predict: "predictor.py:Predictor"
concurrency:
  max: 32
