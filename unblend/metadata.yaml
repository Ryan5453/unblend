  roformer_vocals_ensemble:
    license: mixed
    license_note: >-
      This entry redistributes nothing of its own: it references the melband_roformer_kim
      (MIT) and bs_roformer_anvuew (GPL-3.0) checkpoints, each downloaded under its own terms.
      Using the two together means satisfying both, and the GPL-3.0 grant is the stricter
      of them -- see those entries for the detail.
    provenance: >-
      Two independently-trained vocal models blended with the default weighted mean, the pairing
      UVR and audio-separator users reach for most often. Unblend has not measured its SDR
      against either member; it costs both models' inference time, and single-stem isolation
      cannot skip a member because both contribute to both stems.
    sources: [vocals, other]
    combine: weighted_mean
    members:
    - model: melband_roformer_kim
    - model: bs_roformer_anvuew
