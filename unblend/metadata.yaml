      HTDemucs and SCNet xl-wide over the same four stems, blended with the default weighted
      mean. The two architectures disagree about input normalisation, which Unblend applies
      per member. Unblend has not measured the pair's SDR against either member; it costs
      both models' inference time.
    sources: [drums, bass, other, vocals]
    combine: weighted_mean
    members:
    - model: htdemucs
    - model: scnet_xl_wide_v5
